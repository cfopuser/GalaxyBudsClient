name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Build and sign APK
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          : "${ANDROID_SIGNING_KEYSTORE:?Set the ANDROID_SIGNING_KEYSTORE repository secret}"
          : "${ANDROID_SIGNING_PASSWORD:?Set the ANDROID_SIGNING_PASSWORD repository secret}"
          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/galaxybuds-signing.XXXXXX.p12")"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > "$keystore"
          unset ANDROID_SIGNING_KEYSTORE

          # Match the upstream Android build configuration with embedded assemblies.
          dotnet publish GalaxyBudsClient.Android/GalaxyBudsClient.Android.csproj \
            --framework net10.0-android36.1 --configuration Debug \
            --output "$RUNNER_TEMP/android-publish" \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:AndroidPackageFormats=apk \
            -p:AndroidCreatePackagePerAbi=true '-p:AndroidVersionCodePattern={versionCode}' \
            -p:IsAndroid=true -p:NoDemo=true \
            -p:NotDebuggable=true -p:DebugType=PdbOnly -p:EmbedAssembliesIntoApk=true \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$keystore" \
            -p:AndroidSigningKeyAlias=galaxybudsclient \
            -p:AndroidSigningKeyPass=env:ANDROID_SIGNING_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_SIGNING_PASSWORD

      - name: Verify and prepare APK
        run: |
          tools="$ANDROID_HOME/build-tools/36.1.0"
          package=me.timschneeberger.galaxybudsclient
          publish="$RUNNER_TEMP/android-publish"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            apk="$publish/$package-$abi-Signed.apk"
            "$tools/apksigner" verify --print-certs "$apk"
            badging="$("$tools/aapt" dump badging "$apk")"
            [[ "$badging" == *"package: name='$package'"* ]]
            [[ "$badging" != *"application-debuggable"* ]]
            grep -Fx "native-code: '$abi'" <<< "$badging"

            directory="artifacts/$abi"
            filename="GalaxyBudsClient-Android-$abi.apk"
            mkdir -p "$directory"
            cp "$apk" "$directory/$filename"
            cp LICENSE "$directory/"
            (
              cd "$directory"
              sha256sum "$filename" > "$filename.sha256"
              stat -c '%n %s bytes' "$filename"
            )
          done

      - uses: actions/upload-artifact@v6
        with:
          name: GalaxyBudsClient-Android-arm64-v8a
          path: artifacts/arm64-v8a/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: GalaxyBudsClient-Android-armeabi-v7a
          path: artifacts/armeabi-v7a/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: GalaxyBudsClient-Android-x86_64
          path: artifacts/x86_64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: GalaxyBudsClient-Android-x86
          path: artifacts/x86/
          if-no-files-found: error
